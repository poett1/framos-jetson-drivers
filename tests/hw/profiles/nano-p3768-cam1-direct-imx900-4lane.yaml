# Orin Nano Super devkit, IMX900 directly on FPA-A/P22 cam1, 4 lanes, stock Jetpack 7.2.1. Overlays: fr_fpa_a_p22, fr_imx900-cam1-4lane
name: nano-p3768-cam1-direct-imx900-4lane
dt_model: NVIDIA Jetson Orin Nano/NX Developer Kit (p3768)
dt_compatible: ["nvidia,p3768-0000+p3767-0005-super", "nvidia,p3768-0000+p3767-0005"]
gmsl: false
sensor_dt_path: "/bus@0/cam_i2cmux/i2c@1/imx900_c@1a"
devname: "imx900 9-001a"
badge: imx900_rear_framos
modules: [fr_imx900, fr_common]
argus_tuning: nito
# measured 2026-10-01 (commit 87b8734), as on Jetpack 6: the sensor runs mode 5 at 117 fps
# (VMAX 1743 x 4.902 us), Argus delivers every second frame
known_failures:
  "test_07_argus.py::test_argus_rate[mode5]": "Argus delivers 2064x1552 10-bit at 58.5 fps (every second frame of the sensor's 117 fps); same on stock Jetpack 6"

controls:
  defaults:
    frame_rate: 72000000
    exposure: 10000
    gain: 0

v4l2_modes:
  - {name: 12-bit full, pixelformat: RG12, width: 2064, height: 1552, max_fps: 72.0}
  - {name: 10-bit full, pixelformat: RG10, width: 2064, height: 1552, max_fps: 117.0}
  - {name: 8-bit full, pixelformat: RGGB, width: 2064, height: 1552, max_fps: 125.0}

argus_modes:
  - {sensor_mode: 0, width: 2064, height: 1552, max_fps: 72.0}
  - {sensor_mode: 5, width: 2064, height: 1552, max_fps: 117.0}
