[pytest]
# pytest >= 6.2 (Ubuntu 22.04 / Jetpack 6) and 7.4 (Ubuntu 24.04 / Jetpack 7)
addopts = --strict-markers -rsxX -p pytester
log_cli = true
log_cli_level = INFO
markers =
    unit: hardware-free unit tests of lib/
    env: board, L4T, loaded modules
    dt: live device tree
    probe: sensor probe and media graph
    controls: V4L2 control defaults and 64-bit controls
    stream: raw V4L2 streaming rate, sequence gaps, CSI errors
    image: raw frame content sanity
    compliance: v4l2-compliance against the profile's baseline
    argus: nvarguscamerasrc streaming
